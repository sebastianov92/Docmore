<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Docmore</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1f1f1f; --muted: #6b7280; --accent: #4c6ef5; --border: #d0d4db; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1f1f1f; --fg: #f3f4f6; --muted: #9ca3af; --border: #3a3f47; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, system-ui, Segoe UI, sans-serif; -webkit-app-region: drag; }
      main { width: min(420px, 90vw); -webkit-app-region: no-drag; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      p { margin: 0 0 18px; color: var(--muted); }
      label { display: block; font-size: 13px; margin-bottom: 6px; }
      input { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
      button { margin-top: 12px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      .error { color: #e03131; font-size: 13px; min-height: 20px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Docmore</h1>
      <p>Enter the address of your Docmore server. You can change it later from File › Change server.</p>
      <form id="f">
        <label for="url">Server address</label>
        <input id="url" type="url" placeholder="https://wiki.example.com" autofocus required />
        <button type="submit">Open</button>
        <div class="error" id="err"></div>
      </form>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.get('current')) document.getElementById('url').value = params.get('current');
      if (params.get('error')) document.getElementById('err').textContent = 'Could not reach the server: ' + params.get('error');
      document.getElementById('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        const r = await window.docmoreDesktop.setServer(document.getElementById('url').value);
        if (!r.ok) document.getElementById('err').textContent = r.error;
      });
    </script>
  </body>
</html>
