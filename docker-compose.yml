# Docmore homelab stack. Copy .env.docker.example to .env and fill the secrets,
# then: docker compose up -d --build
services:
  docmore:
    build:
      context: .
      dockerfile: Dockerfile
    image: docmore:latest
    depends_on:
      - db
      - redis
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env (openssl rand -hex 32)}
      DATABASE_URL: postgresql://docmore:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/docmore
      REDIS_URL: redis://redis:6379
      DISABLE_TELEMETRY: 'true'
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Docmore}
      # PDF export: Gotenberg prints pages it fetches from this container
      GOTENBERG_URL: http://gotenberg:3000
      PDF_RENDER_BASE_URL: http://docmore:3000
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - docmore:/app/data/storage

  db:
    # Postgres 18 with the pgvector extension, needed by AI search
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: docmore
      POSTGRES_USER: docmore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  gotenberg:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--api-timeout=90s", "--chromium-auto-start=true"]
    restart: unless-stopped

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmore:
  db_data:
  redis_data:
