name: Docmore
options:
  bundleIdPrefix: com.dezik
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No Developer ID on this machine: ad-hoc signature. See README.md for
    # the settings to change once a signing identity exists.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    # Sparkle stays off until an appcast URL is set (the menu item is hidden).
    SPARKLE_FEED_URL: ""
    SPARKLE_PUBLIC_KEY: ""
    SWIFT_EMIT_LOC_STRINGS: NO
    DEAD_CODE_STRIPPING: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
  # The meeting engine (recording, WhisperKit transcription, queue). With
  # this entry and the dependency below removed the app still builds, with
  # meeting recording reported as unavailable.
  MeetingKit:
    path: MeetingKit
targets:
  Docmore:
    type: application
    platform: macOS
    sources:
      - path: Docmore
    dependencies:
      - package: Sparkle
        product: Sparkle
      - package: MeetingKit
        product: MeetingKit
    info:
      path: Docmore/Support/Info.plist
      properties:
        CFBundleDisplayName: Docmore
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Dezik Labs
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        CFBundleURLTypes:
          - CFBundleURLName: com.dezik.docmore.link
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [docmore]
        NSAppTransportSecurity:
          # Self-hosted servers are often plain http on a LAN or a tailnet.
          # Do not add NSAllowsLocalNetworking next to this key: its presence
          # makes macOS ignore NSAllowsArbitraryLoads.
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: Docmore records your microphone when you record a meeting or attach a voice note.
        NSAudioCaptureUsageDescription: Docmore records the sound of the other participants (system audio) when you record a meeting.
        NSCameraUsageDescription: Docmore uses the camera only when a page asks to capture a photo or video.
        NSLocalNetworkUsageDescription: Docmore connects to your Docmore server on the local network.
        NSFaceIDUsageDescription: Docmore can ask for Touch ID to unlock the app.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dezik.docmore
        PRODUCT_NAME: Docmore
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: Docmore/Support/Docmore.entitlements
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  DocmoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DocmoreTests
      # Logic tests: the pure code is compiled straight into the test bundle,
      # so the tests run without launching the app.
      - path: Docmore/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dezik.docmore.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: ""
schemes:
  Docmore:
    build:
      targets:
        Docmore: all
        DocmoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DocmoreTests
    archive:
      config: Release
