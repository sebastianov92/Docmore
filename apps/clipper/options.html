<!doctype html>
<html><head><meta charset="utf-8"><title>Docmore clipper</title>
<style>body{font:14px system-ui,sans-serif;padding:16px;min-width:320px}label{display:block;margin:10px 0 4px}input,select{width:100%;padding:6px;box-sizing:border-box}button{margin-top:12px;padding:6px 12px}#status{margin-top:8px;color:#555}</style></head>
<body>
<h3>Docmore clipper</h3>
<label>Server address</label><input id="server" placeholder="https://docs.example.com">
<label>API key (write scope)</label><input id="apiKey" type="password" placeholder="paste the key">
<label>Default space</label><select id="space"><option value="">load spaces first</option></select>
<button id="save">Save</button> <button id="test">Load spaces</button>
<div id="status"></div>
<script src="options.js"></script>
</body></html>
